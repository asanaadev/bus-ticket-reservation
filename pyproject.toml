[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-ticket-reservation-demo"
version = "1.0.0"
description = "A clean, local bus ticket reservation terminal app"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bus-ticket = "bus_ticket_reservation.__main__:main"

[tool.setuptools.packages.find]
include = ["bus_ticket_reservation*"]
